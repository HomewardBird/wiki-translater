[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wiki-transporter"
version = "1.5.0"
description = "抓取 PRTS 上的明日方舟剧情 wikitext，排版成 Word / PDF / EPUB 分卷书"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Wiki Transporter contributors" }]
keywords = ["arknights", "prts", "mediawiki", "wikitext", "epub", "docx", "ebook"]
dependencies = ["python-docx>=1.1", "pymupdf>=1.24"]

[project.scripts]
wiki-transporter = "wiki_transporter.cli:main"

[project.urls]
Homepage = "https://github.com/HomewardBird/wiki-transporter"
Repository = "https://github.com/HomewardBird/wiki-transporter"
Issues = "https://github.com/HomewardBird/wiki-transporter/issues"

[tool.setuptools.packages.find]
include = ["wiki_transporter*"]

[tool.setuptools.package-data]
wiki_transporter = ["builtin_plans/*.json"]
"wiki_transporter.gui" = ["web/*", "web/img/*"]
