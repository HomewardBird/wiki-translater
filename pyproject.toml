[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wiki-translater"
version = "1.3.0"
description = "抓取 MediaWiki 站点的剧情 wikitext，排版成 Word / PDF / EPUB 分卷书"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Wiki Translater contributors" }]
keywords = ["mediawiki", "wikitext", "arknights", "prts", "genshin", "wuthering-waves", "reverse-1999", "epub", "docx", "ebook"]
dependencies = ["python-docx>=1.1", "pymupdf>=1.24"]

[project.scripts]
wiki-translater = "prts_story.cli:main"
prts-story = "prts_story.cli:main"

[project.urls]
Homepage = "https://github.com/HomewardBird/wiki-translater"
Repository = "https://github.com/HomewardBird/wiki-translater"
Issues = "https://github.com/HomewardBird/wiki-translater/issues"

[tool.setuptools.packages.find]
include = ["prts_story*"]

[tool.setuptools.package-data]
prts_story = ["builtin_plans/*.json"]
"prts_story.gui" = ["web/*", "web/img/*"]
